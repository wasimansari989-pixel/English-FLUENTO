/* ================= FUTURISTIC MOTION EXPERIENCE ================= */
:root{--motion-fast:180ms;--motion-med:420ms;--motion-slow:780ms;--electric:#b9f529;--violet:#ab8bff}
.phone{isolation:isolate;background:linear-gradient(155deg,#ededf0 0%,#e5e5e9 52%,#e9e9ed 100%)}
.ambient-scene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at var(--light-x,50%) var(--light-y,20%),rgba(255,255,255,.78),transparent 48%),radial-gradient(ellipse at 90% 46%,rgba(201,182,233,.19),transparent 33%)}
.ambient-scene:before{content:"";position:absolute;inset:-25%;opacity:.24;background-image:linear-gradient(rgba(90,90,105,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(90,90,105,.08) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at 50% 35%,#000 0%,transparent 65%);transform:perspective(500px) rotateX(48deg) translateY(-10%);animation:grid-drift 22s linear infinite}
.ambient-scene:after{content:"";position:absolute;width:260px;height:260px;left:-145px;top:24%;border-radius:50%;border:1px solid rgba(173,144,224,.23);box-shadow:0 0 0 22px rgba(173,144,224,.035),0 0 0 47px rgba(173,144,224,.025);animation:ambient-orbit 34s linear infinite}
.ambient-blob{position:absolute;border-radius:50%;filter:blur(22px);opacity:.32;will-change:transform;transform:translateZ(0)}
.ambient-blob.one{width:150px;height:150px;right:-82px;top:8%;background:radial-gradient(circle,#d3c0fa 0%,rgba(211,192,250,0) 72%);animation:blob-drift-a 12s ease-in-out infinite}
.ambient-blob.two{width:180px;height:180px;left:-105px;bottom:13%;background:radial-gradient(circle,#d4ff00 0%,rgba(212,255,0,0) 72%);opacity:.12;animation:blob-drift-b 16s ease-in-out infinite}
.ambient-blob.three{width:120px;height:120px;right:-55px;bottom:30%;background:radial-gradient(circle,#b6a0ed 0%,rgba(182,160,237,0) 72%);opacity:.18;animation:blob-drift-a 18s ease-in-out infinite reverse}
.status,.topbar,.main,.bottom-safe{position:relative;z-index:1}
.toast{z-index:80}
.screen{transform-origin:50% 18%;backface-visibility:hidden}
.screen > *{animation:content-rise .64s cubic-bezier(.18,.76,.25,1) both;will-change:transform,opacity}
.screen > *:nth-child(1){animation-delay:30ms}.screen > *:nth-child(2){animation-delay:85ms}.screen > *:nth-child(3){animation-delay:140ms}.screen > *:nth-child(4){animation-delay:195ms}.screen > *:nth-child(5){animation-delay:250ms}.screen > *:nth-child(6){animation-delay:305ms}.screen > *:nth-child(n+7){animation-delay:350ms}
@keyframes content-rise{from{opacity:0;transform:translate3d(0,18px,0) scale(.985);filter:blur(3px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes grid-drift{0%{background-position:0 0,0 0;transform:perspective(500px) rotateX(48deg) translateY(-10%)}100%{background-position:0 140px,140px 0;transform:perspective(500px) rotateX(48deg) translateY(-4%)}}
@keyframes ambient-orbit{to{transform:rotate(360deg)}}
@keyframes blob-drift-a{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-18px,26px,0) scale(1.12)}}
@keyframes blob-drift-b{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(30px,-22px,0) scale(1.08)}}
/* Cinematic launch moment */
.launch-sequence{position:absolute;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#34343d 0%,#1d1d23 42%,#111115 100%);color:#fff;animation:launch-exit 850ms cubic-bezier(.7,0,.2,1) 1700ms forwards;cursor:pointer}
.launch-sequence:before{content:"";position:absolute;width:340px;height:340px;border:1px solid rgba(212,255,0,.14);border-radius:50%;box-shadow:0 0 0 28px rgba(212,255,0,.025),0 0 0 60px rgba(205,182,233,.035);animation:launch-ring 5s linear infinite}
.launch-sequence:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.075) 42%,transparent 57%);transform:translateX(-120%);animation:launch-sweep 1.2s ease-out .2s both}
.launch-center{position:relative;z-index:2;text-align:center;padding:24px;animation:launch-center-in 800ms cubic-bezier(.16,1,.3,1) both}
.launch-emblem{width:80px;height:80px;margin:0 auto 24px;border-radius:27px;display:grid;place-items:center;background:linear-gradient(145deg,#292930,#151519);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 8px rgba(255,255,255,.025),0 0 45px rgba(212,255,0,.12),inset 0 1px rgba(255,255,255,.17);position:relative;animation:emblem-float 2.8s ease-in-out infinite}
.launch-emblem:before,.launch-emblem:after{content:"";position:absolute;inset:-12px;border-radius:32px;border:1px solid rgba(212,255,0,.42);transform:rotate(18deg);animation:launch-ring 7s linear infinite}
.launch-emblem:after{inset:-20px;border-color:rgba(205,182,233,.35);transform:rotate(-18deg);animation-direction:reverse;animation-duration:9s}
.launch-mark{font-size:35px;font-weight:1000;letter-spacing:-.09em;color:var(--lime);text-shadow:0 0 25px rgba(212,255,0,.38)}
.launch-wordmark{font-size:31px;font-weight:950;letter-spacing:.18em;text-transform:uppercase;opacity:0;animation:wordmark-in 620ms cubic-bezier(.16,1,.3,1) 220ms forwards}
.launch-tag{margin-top:11px;font-size:10px;font-weight:750;letter-spacing:.3em;color:rgba(255,255,255,.53);opacity:0;animation:wordmark-in 560ms ease 460ms forwards}
.launch-progress{width:132px;height:3px;margin:30px auto 0;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.launch-progress span{display:block;width:35%;height:100%;border-radius:99px;background:var(--lime);box-shadow:0 0 12px rgba(212,255,0,.7);animation:launch-load 1.35s cubic-bezier(.65,0,.35,1) .25s forwards}
@keyframes launch-exit{0%{opacity:1;visibility:visible;transform:scale(1)}100%{opacity:0;visibility:hidden;transform:scale(1.035);pointer-events:none}}
@keyframes launch-ring{to{rotate:360deg}}
@keyframes launch-sweep{to{transform:translateX(120%)}}
@keyframes launch-center-in{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes emblem-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes wordmark-in{from{opacity:0;transform:translateY(12px);letter-spacing:.28em;filter:blur(4px)}to{opacity:1;transform:translateY(0);letter-spacing:.18em;filter:blur(0)}}
@keyframes launch-load{from{transform:translateX(-130%)}to{transform:translateX(220%)}}
/* Kinetic text */
.kinetic-kicker{display:inline-flex;align-items:center;gap:8px;animation:kicker-in .8s cubic-bezier(.2,.8,.2,1) both}
.kinetic-kicker:before{content:"";height:1px;width:18px;background:var(--lime);box-shadow:0 0 8px rgba(212,255,0,.5)}
.kinetic-title{display:flex;flex-direction:column;align-items:center;margin:13px 0 11px!important;font-size:clamp(52px,14vw,70px)!important;letter-spacing:-.085em!important;line-height:.82!important;font-weight:1000!important;perspective:600px}
.kinetic-title .title-line{display:block;overflow:hidden;padding:0 .05em .09em;white-space:nowrap}
.kinetic-title .title-word{display:inline-block;transform:translateY(115%) rotateX(-35deg);opacity:0;filter:blur(9px);animation:word-rise 850ms cubic-bezier(.16,1,.3,1) forwards}
.kinetic-title .title-line:nth-child(1) .title-word{animation-delay:180ms}
.kinetic-title .title-line:nth-child(2) .title-word{animation-delay:340ms;color:transparent;background:linear-gradient(100deg,#9999a2 0%,#fcfcff 22%,#b3b3bd 44%,#fff 54%,#8e8e9b 78%,#ececf0 100%);background-size:220% 100%;background-position:130% 0;-webkit-background-clip:text;background-clip:text;animation:word-rise 850ms cubic-bezier(.16,1,.3,1) 340ms forwards,title-glint 2.7s ease-in-out 1.2s infinite}
@keyframes word-rise{0%{transform:translateY(115%) rotateX(-35deg);opacity:0;filter:blur(9px)}70%{opacity:1;filter:blur(0)}100%{transform:translateY(0) rotateX(0);opacity:1;filter:blur(0)}}
@keyframes title-glint{0%,28%,100%{background-position:130% 0}62%{background-position:-20% 0}}
@keyframes kicker-in{from{opacity:0;transform:translateY(8px);letter-spacing:.26em}to{opacity:1;transform:translateY(0);letter-spacing:.17em}}
.hero-stage{position:relative;isolation:isolate;overflow:hidden;transform:translateZ(0);background:linear-gradient(145deg,rgba(246,246,249,.92),rgba(220,220,227,.9))}
.hero-stage:after{content:"";position:absolute;inset:-1px;z-index:-1;pointer-events:none;background:linear-gradient(112deg,transparent 15%,rgba(255,255,255,.52) 37%,transparent 55%);transform:translateX(-125%);animation:surface-sweep 5.8s cubic-bezier(.5,0,.3,1) 1.1s infinite}
@keyframes surface-sweep{0%,24%{transform:translateX(-125%)}58%,100%{transform:translateX(125%)}}
.hero-orbit{position:absolute;width:220px;height:220px;left:50%;top:47%;transform:translate(-50%,-50%);border:1px solid rgba(169,145,218,.24);border-radius:50%;z-index:-1;animation:orbit 24s linear infinite}
.hero-orbit:before,.hero-orbit:after{content:"";position:absolute;inset:14px;border:1px dashed rgba(169,145,218,.25);border-radius:50%;animation:orbit 18s linear infinite reverse}
.hero-orbit:after{inset:37px;border-style:solid;border-color:rgba(212,255,0,.28);animation-duration:13s}
.hero-spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 13px rgba(212,255,0,.9);right:17%;top:25%;animation:spark-pulse 1.9s ease-in-out infinite}
.hero-spark.s2{width:4px;height:4px;right:auto;left:16%;top:68%;background:#b6a0ed;box-shadow:0 0 12px rgba(182,160,237,.9);animation-delay:.7s}
@keyframes spark-pulse{0%,100%{opacity:.4;transform:scale(.65)}50%{opacity:1;transform:scale(1.5)}}
.hero-phrase{position:relative;display:inline-block}
.hero-phrase:after{content:"";position:absolute;left:0;bottom:-5px;width:100%;height:3px;border-radius:99px;background:var(--lime);transform:scaleX(0);transform-origin:left;box-shadow:0 0 12px rgba(212,255,0,.6);animation:underline-draw 550ms cubic-bezier(.16,1,.3,1) 780ms forwards}
@keyframes underline-draw{to{transform:scaleX(1)}}
.hero-chips .chip{animation:chip-float 4.6s ease-in-out infinite;will-change:transform}.hero-chips .chip:nth-child(2){animation-delay:-2.1s}
@keyframes chip-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* Button light-trail and press feedback */
.btn,.choice,.option,.google-card,.tab,.icon-btn,.mini-nav button{position:relative;overflow:hidden;isolation:isolate}
.btn:before,.choice:before,.option:before,.google-card:before{content:"";position:absolute;top:-60%;left:-80%;width:45%;height:220%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.52),transparent);opacity:0;pointer-events:none;z-index:-1}
.btn:hover:before,.choice:hover:before,.option:hover:before,.google-card:hover:before{opacity:1;animation:button-sheen 850ms ease}
@keyframes button-sheen{from{left:-80%}to{left:140%}}
.btn.lime{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,filter .22s}
.btn.lime:hover{filter:saturate(1.08);box-shadow:0 8px 25px rgba(150,180,0,.2),inset 0 1px rgba(255,255,255,.8)}
.btn.lime:active{transform:translateY(1px) scale(.975)}
.hero-card,.choice,.stat,.formula-sheet,.google-card{transition:box-shadow .35s cubic-bezier(.2,.8,.2,1),border-color .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover) and (pointer:fine){.hero-card:not(.home-hero):hover,.choice:hover,.google-card:hover{transform:translateY(-2px)}.hero-stage:hover .hero-orbit{animation-duration:12s}}
/* Keep motion smooth and accessible */
@media(prefers-reduced-motion:reduce){.ambient-scene:before,.ambient-scene:after,.ambient-blob,.launch-sequence,.launch-sequence:before,.launch-sequence:after,.launch-center,.launch-emblem,.launch-mark,.launch-wordmark,.launch-tag,.launch-progress span,.kinetic-kicker,.kinetic-title .title-word,.hero-orbit,.hero-spark,.hero-chips .chip,.hero-stage:after{animation:none!important;filter:none!important;transform:none!important;opacity:1!important}.launch-sequence{display:none!important}.screen > *{animation:none!important;filter:none!important;opacity:1!important;transform:none!important}}

<body>
<div class="app-stage"><div class="phone" role="application" aria-label="Fluent mobile onboarding preview">
  <div class="ambient-scene" aria-hidden="true"><span class="ambient-blob one"></span><span class="ambient-blob two"></span><span class="ambient-blob three"></span></div>
  <div class="status"><span>7:14 ◉ ▴ ▣</span><span class="status-icons"><span>⌁</span><span>VoLTE</span><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"></span><span>60%</span></span></div>
  <div class="topbar"><button class="icon-btn" id="backBtn" aria-label="Go back">‹</button><div class="top-label" id="topLabel">Welcome to Fluent</div><button class="icon-btn" id="helpBtn" aria-label="Help" title="Help">?</button></div>
  <div class="main" id="main"><section class="screen" id="screen"></section></div>
  <div class="bottom-safe"></div><div class="toast" id="toast" role="status"></div>
  <div class="launch-sequence" id="launchSequence" aria-hidden="true" onclick="skipLaunch()"><div class="launch-center"><div class="launch-emblem"><span class="launch-mark">F</span></div><div class="launch-wordmark">FLUENT</div><div class="launch-tag">THINK · SPEAK · BE FLUENT</div><div class="launch-progress"><span></span></div></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const main=$('#main'), topLabel=$('#topLabel'), backBtn=$('#backBtn'), helpBtn=$('#helpBtn'), toastEl=$('#toast');
const state={country:'IN',countryName:'India',language:'Hindi',level:'Beginner',goal:10,notifications:false,google:false,email:'',answers:[],formulaTab:'Present',homeTab:'Learn',searchCountry:''};
let current='welcome',history=[],qIndex=0,toastTimer;
const countries=[['IN','🇮🇳','India','+91'],['US','🇺🇸','United States','+1'],['GB','🇬🇧','United Kingdom','+44'],['CA','🇨🇦','Canada','+1'],['AU','🇦🇺','Australia','+61'],['AE','🇦🇪','United Arab Emirates','+971'],['PK','🇵🇰','Pakistan','+92'],['BD','🇧🇩','Bangladesh','+880'],['NP','🇳🇵','Nepal','+977'],['SG','🇸🇬','Singapore','+65']];
const langList=[['Hindi','हिन्दी','Best for Hindi speakers'],['English','English','Full English interface'],['Hinglish','Hindi + English','A mix of Hindi and English'],['Spanish','Español','Learn English with Spanish']];
const levels={
 Beginner:[
  {q:'Choose the correct sentence.',sub:'Present simple · Basic',opts:['She go to school.','She goes to school.','She going to school.','She gone to school.'],correct:1,why:'With “she”, the present simple usually uses goes.'},
  {q:'Complete the sentence: “I ___ learning English.”',sub:'Present continuous · Basic',opts:['am','is','are','be'],correct:0,why:'Use “am” with “I”: I am learning English.'},
  {q:'Which sentence talks about the past?',sub:'Past simple · Basic',opts:['I play cricket.','I am playing cricket.','I played cricket.','I will play cricket.'],correct:2,why:'“Played” is the past form of “play”.'}],
 Intermediate:[
  {q:'Choose the most natural sentence.',sub:'Present perfect · Intermediate',opts:['I have finished my work.','I has finished my work.','I have finish my work.','I am finished my work.'],correct:0,why:'Use have + past participle: “have finished”.'},
  {q:'Complete: “She has lived here ___ 2020.”',sub:'Since and for · Intermediate',opts:['for','since','during','from'],correct:1,why:'Use “since” with a starting point in time.'},
  {q:'Choose the correct conditional.',sub:'First conditional · Intermediate',opts:['If it rains, we will stay home.','If it will rain, we stay home.','If it rain, we will stayed home.','If it rained, we will stay home.'],correct:0,why:'A common first conditional pattern is if + present simple, will + base verb.'}],
 Advanced:[
  {q:'Choose the grammatically correct sentence.',sub:'Inversion · Advanced',opts:['Rarely I have seen such care.','Rarely have I seen such care.','Rarely did I have saw such care.','Rarely I saw have such care.'],correct:1,why:'Negative adverbs such as “rarely” can trigger subject–auxiliary inversion.'},
  {q:'Complete: “Had I known, I ___ earlier.”',sub:'Third conditional inversion · Advanced',opts:['would leave','would have left','will have left','had leave'],correct:1,why:'“Had I known” corresponds to “If I had known”; the result uses would have + past participle.'},
  {q:'Choose the clearest reported-speech form.',sub:'Reported speech · Advanced',opts:['She said she is already leave.','She said that she had already left.','She said she has already leaving.','She said that she already leaves yesterday.'],correct:1,why:'“Had already left” is a natural backshifted form when reporting a past statement.'}]
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2500)}
function go(id){history.push(current);current=id;render(true)}
function back(){if(current==='assessment'&&qIndex>0){qIndex--;render(false);return}if(history.length){current=history.pop();render(false)}else if(current!=='welcome'){current='welcome';render(false)}}
backBtn.addEventListener('click',back);
helpBtn.addEventListener('click',()=>toast('This is a clickable UI prototype. Real account and AI services connect in the app.'));
function stepCount(){const steps=['welcome','country','language','account','level','assessmentIntro','assessment','result','goal','reminders','formulas','ready'];return Math.max(1,steps.indexOf(current)+1)}
function topInfo(){const names={welcome:'Welcome to Fluent',country:'Country / Region',language:'App Language',account:'Create your account',level:'Your English level',assessmentIntro:'AI Level Check',assessment:'Quick Assessment',result:'Your Level Snapshot',goal:'Daily Learning Goal',reminders:'Learning Reminders',formulas:'600+ Formulas',ready:'You’re Ready!',home:'Let’s learn'};topLabel.textContent=names[current]||'Fluent';backBtn.style.visibility=current==='welcome'?'hidden':'visible';helpBtn.style.visibility=['welcome','ready','home'].includes(current)?'hidden':'visible'}
function progress(){const p=Math.round((stepCount()/12)*100);return `<div class="progress-track" aria-label="Setup progress"><span style="width:${p}%"></span></div>`}
function render(animate=true){topInfo();let html='';switch(current){case'welcome':html=welcome();break;case'country':html=countryScreen();break;case'language':html=languageScreen();break;case'account':html=accountScreen();break;case'level':html=levelScreen();break;case'assessmentIntro':html=assessmentIntroScreen();break;case'assessment':html=questionScreen();break;case'result':html=resultScreen();break;case'goal':html=goalScreen();break;case'reminders':html=reminderScreen();break;case'formulas':html=formulaIntroScreen();break;case'ready':html=readyScreen();break;case'home':html=homeScreen();break;default:html=welcome()}const node=document.createElement('section');node.className='screen';node.innerHTML=html;if(!animate)node.style.animation='none';$('#screen').replaceWith(node);node.id='screen';main.scrollTop=0;syncTop();}
function syncTop(){topLabel.textContent=({welcome:'Welcome to Fluent',country:'Country / Region',language:'App Language',account:'Create your account',level:'Your English level',assessmentIntro:'AI Level Check',assessment:'Quick Assessment',result:'Your Level Snapshot',goal:'Daily Learning Goal',reminders:'Learning Reminders',formulas:'600+ Formulas',ready:'You’re Ready!',home:'Let’s learn'})[current]||'Fluent';backBtn.style.visibility=current==='welcome'||current==='home'?'hidden':'visible';helpBtn.style.visibility=['welcome','ready','home'].includes(current)?'hidden':'visible'}
function welcome(){return `<div class="hero-card home-hero hero-stage" style="min-height:292px;padding-top:29px;padding-bottom:28px"><div class="hero-orbit" aria-hidden="true"></div><span class="hero-spark" aria-hidden="true"></span><span class="hero-spark s2" aria-hidden="true"></span><div class="eyebrow kinetic-kicker">THINK · SPEAK · BE FLUENT</div><h1 class="kinetic-title"><span class="title-line"><span class="title-word">SPEAK</span></span><span class="title-line"><span class="title-word">ENGLISH</span></span></h1><p class="sub" style="animation:kicker-in .7s ease .55s both">Build confidence, <span class="hero-phrase">one sentence</span> at a time.</p><div class="row hero-chips" style="justify-content:center;margin-top:21px"><span class="chip">✦ 600+ formulas</span><span class="chip">◉ Hindi support</span></div></div><div class="hero-card hero-stage" style="margin-top:17px;padding:22px 19px"><span class="hero-spark" style="top:22px;right:25px" aria-hidden="true"></span><div class="row between"><div><div class="eyebrow">YOUR NEXT CHAPTER</div><h2 style="font-size:25px;letter-spacing:-.05em;line-height:1.05;margin:10px 0">Speak naturally.<br><span class="hero-phrase">Think confidently.</span></h2></div><div class="launch-emblem" style="width:58px;height:58px;min-width:58px;margin:0;border-radius:20px;animation:emblem-float 3s ease-in-out infinite"><span class="launch-mark" style="font-size:25px">F</span></div></div><p class="sub" style="margin-top:9px">Learn English patterns with simple Hindi explanations, examples, quizzes, and guided AI practice.</p><div class="actions"><button class="btn lime" onclick="go('country')">Get started <span>→</span></button><button class="btn light" onclick="go('account')">I already have an account</button></div><p class="footer-note">Personalise your learning in a few quick steps.</p></div>`}
function countryScreen(){const rows=countries.filter(c=>(c[2]+' '+c[0]).toLowerCase().includes(state.searchCountry.toLowerCase()));return `${progress()}<div style="padding-top:6px"><div class="eyebrow">STEP 1 OF SETUP</div><h1 class="h1">Where are<br>you <span class="outline-word">from?</span></h1><p class="sub">Choose your country or region for the right local settings.</p></div><div class="search-wrap"><span class="search-icon">⌕</span><input class="field" id="countrySearch" placeholder="Search country..." value="${esc(state.searchCountry)}" oninput="updateCountrySearch(this.value)" aria-label="Search country"></div><div class="scroll-list" id="countryList">${rows.map(c=>`<button class="choice ${state.country===c[0]?'selected':''}" onclick="selectCountry('${c[0]}')"><span class="flag">${c[1]}</span><span class="grow"><span class="choice-title">${c[2]}</span><span class="choice-sub" style="display:block">Dial code ${c[3]}</span></span><span class="radio"></span></button>`).join('')||'<p class="small">No matching country. Try another search.</p>'}</div><div class="actions"><button class="btn lime" onclick="go('language')">Continue <span>→</span></button></div>`}
function updateCountrySearch(v){state.searchCountry=v;const list=$('#countryList');if(!list)return;const rows=countries.filter(c=>(c[2]+' '+c[0]).toLowerCase().includes(v.toLowerCase()));list.innerHTML=rows.map(c=>`<button class="choice ${state.country===c[0]?'selected':''}" onclick="selectCountry('${c[0]}')"><span class="flag">${c[1]}</span><span class="grow"><span class="choice-title">${c[2]}</span><span class="choice-sub" style="display:block">Dial code ${c[3]}</span></span><span class="radio"></span></button>`).join('')||'<p class="small">No matching country. Try another search.</p>'}
function selectCountry(code){const c=countries.find(x=>x[0]===code);if(c){state.country=c[0];state.countryName=c[2];render(false)}}
function languageScreen(){return `${progress()}<div class="eyebrow">STEP 2 OF SETUP</div><h1 class="h1">Choose your<br><span class="outline-word">language.</span></h1><p class="sub">Pick the language you’re most comfortable learning with. You can change it later in settings.</p><div class="level-grid">${langList.map((l,i)=>`<button class="choice level-card ${state.language===l[0]?'selected':''}" onclick="selectLanguage('${l[0]}')"><div class="grow"><div class="choice-title">${l[1]}</div><div class="choice-sub">${l[2]}</div></div><span class="radio"></span></button>`).join('')}</div><div class="soft-card" style="padding:13px 14px;margin-top:16px;box-shadow:var(--shadow-in);background:#e6e6e9"><div class="row"><span style="font-size:20px">🌐</span><span class="small">Learning content will still help you practise English, with explanations in your chosen interface language when available.</span></div></div><div class="actions"><button class="btn lime" onclick="go('account')">Continue <span>→</span></button></div>`}
function selectLanguage(l){state.language=l;render(false)}
function accountScreen(){return `${progress()}<div class="eyebrow">STEP 3 OF SETUP</div><h1 class="h1">Your English<br>journey starts<br><span class="outline-word">with you.</span></h1><p class="sub">Create an account to keep your learning progress and saved formulas together.</p><div class="hero-card" style="padding:20px;margin-top:22px"><button class="google-card" onclick="googleContinue()"><span class="google-logo">G</span><span class="grow" style="text-align:left">Continue with Google</span><span style="font-size:17px">→</span></button><div class="divider">OR CONTINUE WITH EMAIL</div><label class="small" for="emailField" style="display:block;margin:0 0 7px 3px">Email address</label><input class="field" id="emailField" inputmode="email" type="email" placeholder="you@example.com" value="${esc(state.email)}" oninput="state.email=this.value"><p class="small" style="margin:11px 2px 0">By continuing, you agree to the app’s Terms and Privacy Policy.</p><div class="actions"><button class="btn lime" onclick="emailContinue()">Continue with email <span>→</span></button></div><p class="footer-note">Preview only: Google and email authentication are not connected.</p></div><button class="text-btn" style="display:block;margin:8px auto" onclick="go('level')">Explore without signing in</button>`}
function googleContinue(){state.google=true;toast('Demo sign-in successful — real Google OAuth is not connected.');setTimeout(()=>go('level'),400)}function emailContinue(){const e=$('#emailField')?.value.trim()||'';if(!/^\S+@\S+\.\S+$/.test(e)){toast('Enter a valid email address.');return}state.email=e;toast('Demo account flow — no email was sent.');setTimeout(()=>go('level'),400)}
function levelScreen(){const choices=[['Beginner','🌱','I’m starting from the basics.','Simple sentences and everyday English.'],['Intermediate','🚀','I know some English already.','Build fluency, grammar, and confidence.'],['Advanced','⚡','I can communicate comfortably.','Refine accuracy, nuance, and expression.']];return `${progress()}<div class="eyebrow">STEP 4 OF SETUP</div><h1 class="h1">Where is your<br>English <span class="outline-word">today?</span></h1><p class="sub">Choose the level that feels closest to you. Your AI placement check will help personalise the practice.</p><div class="level-grid">${choices.map(([name,emoji,desc,sub])=>`<button class="choice level-card ${state.level===name?'selected':''}" onclick="selectLevel('${name}')"><div style="display:flex;align-items:center;width:100%;gap:10px"><div style="font-size:25px">${emoji}</div><div class="grow"><div class="choice-title">${name}</div><div class="choice-sub">${desc}</div></div><span class="tick">✓</span></div><div class="small" style="margin-left:35px">${sub}</div></button>`).join('')}</div><div class="actions"><button class="btn lime" onclick="go('assessmentIntro')">Personalise my learning <span>→</span></button></div><p class="footer-note">Not sure? Pick the closest option. You can adjust it later.</p>`}
function selectLevel(l){state.level=l;render(false)}
function assessmentIntroScreen(){return `${progress()}<div class="orb-wrap"><div class="orb"><div class="orb-core"></div></div><div class="orbit-dot"></div></div><div style="text-align:center"><div class="eyebrow">YOUR PERSONAL AI COACH</div><h1 class="h1" style="font-size:36px">Let’s find your<br><span class="outline-word">starting point.</span></h1><p class="sub">Answer a few questions at your ${esc(state.level.toLowerCase())} level. Your result can guide which lessons to begin with.</p></div><div class="stats"><div class="stat"><strong>3</strong><span>Sample questions</span></div><div class="stat"><strong>2 min</strong><span>Estimated time</span></div><div class="stat"><strong>AI</strong><span>Personalised path</span></div></div><div class="hero-card" style="padding:16px"><div class="feature-row"><span class="feature-icon">✦</span><div><strong style="font-size:13px">No pressure</strong><p class="small" style="margin-top:4px">This is a practice check, not an exam. You’ll get helpful explanations.</p></div></div></div><div class="actions"><button class="btn lime" onclick="startAssessment()">Start level check <span>→</span></button><button class="btn light" onclick="go('goal')">Skip for now</button></div><p class="footer-note">This prototype uses sample questions and local scoring; it is not connected to a live AI service.</p>`}
function startAssessment(){qIndex=0;state.answers=[];go('assessment')}
function questionScreen(){const qs=levels[state.level]||levels.Beginner;const q=qs[qIndex];return `${progress()}<div class="row between"><span class="chip">${esc(state.level)} track</span><span class="small">Question ${qIndex+1} of ${qs.length}</span></div><div class="progress-track"><span style="width:${(qIndex+1)/qs.length*100}%"></span></div><div class="question-card hero-card"><div class="question-number">${esc(q.sub)}</div><h2 class="question-title">${esc(q.q)}</h2>${q.opts.map((o,i)=>`<button class="option ${state.answers[qIndex]===i?'selected':''}" onclick="chooseAnswer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>${state.answers[qIndex]===i?'<span style="margin-left:auto">✓</span>':''}</button>`).join('')}</div><div class="actions"><button class="btn lime" ${state.answers[qIndex]===undefined?'disabled':''} onclick="nextQuestion()">${qIndex===qs.length-1?'See my result':'Next question'} <span>→</span></button></div><p class="footer-note">Choose the best answer. Explanations appear in your result.</p>`}
function chooseAnswer(i){state.answers[qIndex]=i;render(false)}function nextQuestion(){if(state.answers[qIndex]===undefined){toast('Choose an answer to continue.');return}const qs=levels[state.level]||levels.Beginner;if(qIndex<qs.length-1){qIndex++;render(true)}else go('result')}
function resultScreen(){const qs=levels[state.level]||levels.Beginner;const score=state.answers.reduce((n,a,i)=>n+(a===qs[i].correct?1:0),0);const rec=score===3?state.level:(score===2?(state.level==='Advanced'?'Intermediate':state.level):(state.level==='Beginner'?'Beginner':state.level==='Advanced'?'Intermediate':'Beginner'));return `${progress()}<div class="orb-wrap" style="height:125px"><div class="orb" style="animation-duration:4.5s"><div class="orb-core"></div></div><div class="orbit-dot"></div></div><div style="text-align:center"><div class="eyebrow">YOUR PRACTICE SNAPSHOT</div><h1 class="h1" style="font-size:38px">Nice work,<br><span class="outline-word">learner.</span></h1><p class="sub">You answered <strong>${score} out of ${qs.length}</strong> sample questions correctly.</p></div><div class="stats"><div class="stat"><strong>${score}/${qs.length}</strong><span>Correct</span></div><div class="stat"><strong>${rec}</strong><span>Suggested start</span></div><div class="stat"><strong>1st</strong><span>Step taken</span></div></div><div class="hero-card" style="padding:17px"><div class="row between"><strong style="font-size:14px">Answer review</strong><span class="chip">${esc(state.level)} set</span></div>${qs.map((q,i)=>`<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px"><div class="row" style="align-items:flex-start"><span style="color:${state.answers[i]===q.correct?'#517b00':'#c5322a'};font-weight:900">${state.answers[i]===q.correct?'✓':'↳'}</span><div><div style="font-size:12px;font-weight:800">${esc(q.q)}</div><div class="small" style="margin-top:5px">${esc(q.why)}</div></div></div></div>`).join('')}</div><div class="actions"><button class="btn lime" onclick="state.level='${rec}';go('goal')">Build my learning plan <span>→</span></button><button class="btn light" onclick="startAssessment()">Try again</button></div><p class="footer-note">Sample assessment only. Connect your AI backend for adaptive questions and real placement recommendations.</p>`}
function goalScreen(){const goals=[[5,'🌿','Gentle start','Easy to maintain'],[10,'✨','Balanced','A little every day'],[15,'🔥','Focused','Build momentum'],[20,'⚡','Deep practice','Make more progress']];return `${progress()}<div class="eyebrow">STEP 6 OF SETUP</div><h1 class="h1">Make room for<br><span class="outline-word">your English.</span></h1><p class="sub">Choose a daily goal that fits your routine. Small, consistent sessions add up.</p><div class="goal-grid">${goals.map(([m,emoji,title,desc])=>`<button class="choice goal-card ${state.goal===m?'selected':''}" onclick="selectGoal(${m})"><span style="font-size:24px">${emoji}</span><span class="goal-min">${m} min</span><span class="choice-title">${title}</span><span class="choice-sub">${desc}</span></button>`).join('')}</div><div class="hero-card" style="padding:15px;margin-top:16px"><div class="row"><span style="font-size:23px">🎯</span><div><strong style="font-size:13px">Your goal: ${state.goal} minutes a day</strong><p class="small" style="margin-top:3px">You can change this anytime in your profile.</p></div></div></div><div class="actions"><button class="btn lime" onclick="go('reminders')">Set my routine <span>→</span></button></div>`}
function selectGoal(m){state.goal=m;render(false)}
function reminderScreen(){return `${progress()}<div class="orb-wrap" style="height:125px"><div style="height:91px;width:91px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:linear-gradient(145deg,#f8f8fb,#dedee4);box-shadow:var(--shadow-out);animation:orb-float 4s infinite">♧</div></div><div style="text-align:center"><div class="eyebrow">A GENTLE NUDGE</div><h1 class="h1" style="font-size:36px">A little reminder<br>goes a <span class="outline-word">long way.</span></h1><p class="sub">A daily reminder can help you keep your learning streak alive.</p></div><div class="hero-card" style="padding:17px;margin-top:22px"><div class="row between"><div><strong style="font-size:14px">Daily learning reminder</strong><div class="choice-sub" style="margin-top:5px">Suggested time · 7:00 PM</div></div><button class="icon-btn" style="width:52px;border-radius:18px;font-size:23px;background:${state.notifications?'var(--lime)':'linear-gradient(145deg,#f7f7f9,#dedee2)'}" onclick="toggleReminders()" aria-label="Toggle reminders">${state.notifications?'✓':'○'}</button></div></div><div class="actions"><button class="btn lime" onclick="go('formulas')">Continue <span>→</span></button><button class="btn light" onclick="state.notifications=false;go('formulas')">Maybe later</button></div><p class="footer-note">Prototype preference only. Actual notifications require permission and native scheduling.</p>`}
function toggleReminders(){state.notifications=!state.notifications;render(false);toast(state.notifications?'Reminder preference enabled in this demo.':'Reminder preference turned off.')}
function formulaIntroScreen(){const tab=state.formulaTab;const data={Present:['Present Simple','Subject + V1 (s/es)','मैं रोज़ किताबें पढ़ता हूँ।','I <span class="highlight">read books every day</span>.'],Past:['Past Simple','Subject + V2','मैंने कल किताब पढ़ी।','I <span class="highlight">read a book yesterday</span>.'],Future:['Future Simple','Subject + will + V1','मैं कल पढ़ूँगा।','I <span class="highlight">will study tomorrow</span>.']}[tab];return `${progress()}<div class="eyebrow">YOUR ENGLISH TOOLKIT</div><h1 class="h1">600+ formulas.<br><span class="outline-word">Clear patterns.</span></h1><p class="sub">Learn reusable sentence structures instead of memorising isolated sentences. Start with a pattern, understand it in Hindi, then practise with examples.</p><div class="formula-stack"><div class="formula-sheet back2"><div class="formula-name">FORMULA COLLECTION</div><div class="formula-structure">S + V + O</div><div class="formula-example">Sentence building blocks</div></div><div class="formula-sheet" style="background:#d7ec83;transform:translate(-54%,-49%) rotate(-5deg)"><div class="formula-name">PRACTICE CARD</div><div class="formula-structure">EN ↔ HI</div><div class="formula-example">Meaning that connects</div></div><div class="formula-sheet front"><div class="formula-name">${esc(tab.toUpperCase())} TENSE</div><div class="formula-structure">${esc(data[1])}</div><div class="formula-example">A pattern you can use again</div></div></div><div class="tabs">${['Present','Past','Future'].map(t=>`<button class="tab ${tab===t?'active':''}" onclick="selectFormulaTab('${t}')">${t}</button>`).join('')}</div><div class="hero-card" style="padding:17px"><div class="row between"><span class="chip">Example formula</span><span class="chip lime">${esc(tab)}</span></div><h3 style="font-size:18px;letter-spacing:-.03em;margin:13px 0 5px">${esc(data[0])}</h3><div class="formula-structure" style="font-size:17px;margin:8px 0 14px">${esc(data[1])}</div><div class="small" style="margin-bottom:6px">Hindi</div><div style="font-weight:800;font-size:14px">${esc(data[2])}</div><div class="small" style="margin:12px 0 6px">English · matching phrase highlighted</div><div style="font-weight:750;font-size:14px;line-height:1.5">${data[3]}</div></div><div class="feature-row"><span class="feature-icon">✓</span><div><strong style="font-size:13px">Understand the structure</strong><p class="small" style="margin-top:4px">Explore formulas with explanations, examples, saved items, and quizzes.</p></div></div><div class="feature-row"><span class="feature-icon">✦</span><div><strong style="font-size:13px">Learn at your level</strong><p class="small" style="margin-top:4px">Build your understanding step by step with guided practice.</p></div></div><div class="actions"><button class="btn lime" onclick="go('ready')">Show my learning path <span>→</span></button></div><p class="footer-note">These are illustrative samples for this prototype. Load and display your complete existing 600-formula dataset in the real app.</p>`}
function selectFormulaTab(t){state.formulaTab=t;render(false)}
function readyScreen(){return `<div class="orb-wrap" style="height:150px;margin-top:5px"><div class="orb"><div class="orb-core"></div></div><div class="orbit-dot"></div></div><div style="text-align:center"><div class="eyebrow">PERSONAL LEARNING PROFILE</div><h1 class="h1" style="font-size:39px">You’re ready<br>to <span class="outline-word">begin.</span></h1><p class="sub">Your learning space is ready to personalise around your preferences.</p></div><div class="hero-card" style="padding:18px;margin-top:20px"><div class="row between"><span class="small">Country</span><strong style="font-size:13px">${esc(state.countryName)}</strong></div><div class="row between" style="margin-top:13px"><span class="small">App language</span><strong style="font-size:13px">${esc(state.language)}</strong></div><div class="row between" style="margin-top:13px"><span class="small">Starting level</span><span class="chip lime">${esc(state.level)}</span></div><div class="row between" style="margin-top:13px"><span class="small">Daily learning goal</span><strong style="font-size:13px">${state.goal} minutes</strong></div><div class="row between" style="margin-top:13px"><span class="small">Daily reminder</span><strong style="font-size:13px">${state.notifications?'On (demo)':'Not set'}</strong></div></div><div class="checklist"><div class="checkline"><b>✓</b> A personal starting point</div><div class="checkline"><b>✓</b> 600+ formula learning path</div><div class="checkline"><b>✓</b> Practice at your own pace</div></div><div class="actions"><button class="btn lime" onclick="history=[];go('home')">Start learning <span>→</span></button><button class="btn light" onclick="go('formulas')">Explore 600+ formulas</button></div>`}
function homeScreen(){return `<div class="row between" style="margin-bottom:13px"><div><div class="eyebrow">YOUR DAILY PRACTICE</div><h2 style="font-size:25px;letter-spacing:-.055em;margin:6px 0 0">Hello, learner ✦</h2></div><span class="chip lime">${esc(state.level)}</span></div><div class="hero-card home-hero hero-stage" style="min-height:235px"><div class="hero-orbit" aria-hidden="true"></div><span class="hero-spark" aria-hidden="true"></span><span class="eyebrow kinetic-kicker">THINK · SPEAK · BE FLUENT</span><h1 class="kinetic-title"><span class="title-line"><span class="title-word">SPEAK</span></span><span class="title-line"><span class="title-word">ENGLISH</span></span></h1><p class="sub">A little practice. <span class="hero-phrase">More confidence.</span></p></div><div class="hero-card" style="padding:18px;margin-top:16px"><div class="row between"><div><div class="eyebrow">TODAY’S GOAL</div><div style="font-size:24px;font-weight:950;margin-top:5px">${state.goal} minutes</div><div class="small">You’re ready to keep going.</div></div><div style="height:68px;width:68px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime) 0 68%,#cacacf 68%);box-shadow:var(--shadow-out)"><div style="height:53px;width:53px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:900">0%</div></div></div><div class="actions"><button class="btn lime" onclick="go('formulas')">Explore formulas <span>→</span></button><button class="btn light" onclick="go('assessmentIntro')">Try level practice</button></div></div><div class="hero-card" style="padding:18px;margin-top:16px"><div class="row between"><strong style="font-size:15px">Your learning toolkit</strong><span class="chip">3 paths</span></div><div class="feature-row"><span class="feature-icon">📘</span><div><strong style="font-size:13px">600+ Sentence Formulas</strong><div class="small">Clear patterns with Hindi support.</div></div></div><div class="feature-row"><span class="feature-icon">✦</span><div><strong style="font-size:13px">AI English Coach</strong><div class="small">Personalised conversation practice when connected.</div></div></div><div class="feature-row"><span class="feature-icon">✓</span><div><strong style="font-size:13px">Practice & review</strong><div class="small">Quizzes, saved formulas, and progress.</div></div></div></div><div style="height:8px"></div><div class="mini-nav">${['Learn','Formulas','Practice','You'].map((t,i)=>`<button class="${state.homeTab===t?'active':''}" onclick="homeNav('${t}')">${['⌂','▤','◉','○'][i]} ${t}</button>`).join('')}</div><p class="footer-note">Prototype home. Existing app routes and real progress should be connected during implementation.</p>`}
function homeNav(t){state.homeTab=t;if(t==='Formulas'){go('formulas');return}if(t==='Practice'){go('assessmentIntro');return}if(t==='You'){toast('Connect this tab to the existing Profile screen.');return}render(false)}
function selectCountryAndRefresh(){};
function skipLaunch(){const el=$('#launchSequence');if(el){el.style.animation='launch-exit 260ms ease forwards';setTimeout(()=>el.remove(),280)}}
const launchEl=$('#launchSequence');if(launchEl){const launchTimer=setTimeout(()=>{if(launchEl.isConnected)launchEl.remove()},2600);launchEl.addEventListener('click',()=>{clearTimeout(launchTimer);skipLaunch()},{once:true})}
window.skipLaunch=skipLaunch;window.go=go;window.back=back;window.updateCountrySearch=updateCountrySearch;window.selectCountry=selectCountry;window.selectLanguage=selectLanguage;window.googleContinue=googleContinue;window.emailContinue=emailContinue;window.selectLevel=selectLevel;window.startAssessment=startAssessment;window.chooseAnswer=chooseAnswer;window.nextQuestion=nextQuestion;window.selectGoal=selectGoal;window.toggleReminders=toggleReminders;window.selectFormulaTab=selectFormulaTab;window.homeNav=homeNav;
render(false);
// Gentle pointer-responsive surface lighting for desktop preview; no layout changes.
const phoneEl=document.querySelector('.phone');if(phoneEl&&window.matchMedia('(hover:hover) and (pointer:fine)').matches){phoneEl.addEventListener('pointermove',e=>{const r=phoneEl.getBoundingClientRect();phoneEl.style.setProperty('--light-x',`${Math.round((e.clientX-r.left)/r.width*100)}%`);phoneEl.style.setProperty('--light-y',`${Math.round((e.clientY-r.top)/r.height*100)}%`);},{passive:true});phoneEl.addEventListener('pointerleave',()=>{phoneEl.style.setProperty('--light-x','50%');phoneEl.style.setProperty('--light-y','35%')},{passive:true})}
</script>
