<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Let's Start Anime.js Logo Animation</title>
  <style>
    :root {
      font-size: 14px;
    }
    @media (min-width: 350px) { :root { font-size: 15px; } }
    @media (min-width: 640px) { :root { font-size: 22px; } }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0F0F14;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    section {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logo-container {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .logo {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #lines * {
      mix-blend-mode: lighten;
    }

    #fills * {
      opacity: 0;
      mix-blend-mode: lighten;
    }

    .tagline-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body.ready .tagline-container {
      opacity: 1;
      transform: translateY(0);
    }

    .tagline-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .tagline-spark {
      color: #D4FF00;
      font-size: 14px;
      animation: pulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    .tagline-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .enter-btn {
      margin-top: 24px;
      background: #D4FF00;
      color: #111116;
      border: none;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;
      cursor: pointer;
      box-shadow: 0 0 26px rgba(212, 255, 0, 0.5);
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .enter-btn.visible {
      opacity: 1;
      transform: scale(1);
    }

    .enter-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>
  <canvas class="fireworks"></canvas>

  <section>
    <div class="logo-container">
      <svg class="logo" viewBox="0 0 520 330">
        <defs>
          <radialGradient id="g-blue" cx="50%" cy="0%" r="90%">
            <stop stop-color="#38BDF8" offset="0%"/>
            <stop stop-color="#2563EB" offset="100%"/>
          </radialGradient>
          <radialGradient id="g-coral" cx="50%" cy="0%" r="90%">
            <stop stop-color="#FF6B81" offset="0%"/>
            <stop stop-color="#FF1744" offset="100%"/>
          </radialGradient>
          <radialGradient id="g-gold" cx="50%" cy="0%" r="90%">
            <stop stop-color="#FDE047" offset="0%"/>
            <stop stop-color="#F59E0B" offset="100%"/>
          </radialGradient>
          <radialGradient id="g-lime" cx="50%" cy="0%" r="90%">
            <stop stop-color="#6EE7B7" offset="0%"/>
            <stop stop-color="#10B981" offset="100%"/>
          </radialGradient>
          <radialGradient id="g-purple" cx="50%" cy="0%" r="90%">
            <stop stop-color="#C084FC" offset="0%"/>
            <stop stop-color="#7C3AED" offset="100%"/>
          </radialGradient>
        </defs>

        <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
          <!-- Bouncing white dot (Julian Garnier signature dot) -->
          <circle id="dot-wasii" fill="#FFFFFF" cx="308" cy="40" r="12" transform="translate(0, -200)"></circle>

          <!-- ===================================================== -->
          <!-- 1. LINES (Stroke dashoffset drawing group)            -->
          <!-- ===================================================== -->
          <g id="lines">
            <!-- ROW 1: LET'S -->
            <!-- L (Blue) -->
            <path d="M 50 30 L 50 130 L 100 130" stroke="#2563EB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- E (Coral) -->
            <path d="M 180 40 L 135 40 L 135 130 L 180 130 M 135 85 L 175 85" stroke="#FF1744" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- T (Gold) -->
            <path d="M 215 40 L 285 40 M 250 40 L 250 130" stroke="#F59E0B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- Apostrophe ' (White) -->
            <path d="M 308 30 L 308 50" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
            <!-- S (Lime) -->
            <path d="M 400 55 C 400 38 385 30 368 30 C 350 30 336 42 336 60 C 336 78 350 86 368 92 C 388 98 402 106 402 122 C 402 138 386 146 368 146 C 348 146 334 136 334 120" stroke="#10B981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

            <!-- ROW 2: START -->
            <!-- S (Gold) -->
            <path d="M 90 205 C 90 188 75 180 58 180 C 40 180 26 192 26 210 C 26 228 40 236 58 242 C 78 248 92 256 92 272 C 92 288 76 296 58 296 C 38 296 24 286 24 270" stroke="#F59E0B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- T (Blue) -->
            <path d="M 125 190 L 195 190 M 160 190 L 160 280" stroke="#2563EB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- A (Coral) -->
            <path d="M 225 290 L 255 188 C 258 180 266 176 274 176 C 282 176 290 180 293 188 L 323 290 M 240 250 L 308 250" stroke="#FF1744" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- R (Purple) -->
            <path d="M 355 290 L 355 185 L 390 185 C 408 185 418 196 418 212 C 418 228 406 238 390 238 L 355 238 M 385 238 L 418 290" stroke="#7C3AED" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- T (Lime) -->
            <path d="M 445 190 L 515 190 M 480 190 L 480 280" stroke="#10B981" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>

          <!-- ===================================================== -->
          <!-- 2. FILLS (Gradient glowing overlays)                  -->
          <!-- ===================================================== -->
          <g id="fills">
            <!-- ROW 1 -->
            <path d="M 50 30 L 50 130 L 100 130" stroke="url(#g-blue)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 180 40 L 135 40 L 135 130 L 180 130 M 135 85 L 175 85" stroke="url(#g-coral)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 215 40 L 285 40 M 250 40 L 250 130" stroke="url(#g-gold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 308 30 L 308 50" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
            <path d="M 400 55 C 400 38 385 30 368 30 C 350 30 336 42 336 60 C 336 78 350 86 368 92 C 388 98 402 106 402 122 C 402 138 386 146 368 146 C 348 146 334 136 334 120" stroke="url(#g-lime)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

            <!-- ROW 2 -->
            <path d="M 90 205 C 90 188 75 180 58 180 C 40 180 26 192 26 210 C 26 228 40 236 58 242 C 78 248 92 256 92 272 C 92 288 76 296 58 296 C 38 296 24 286 24 270" stroke="url(#g-gold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 125 190 L 195 190 M 160 190 L 160 280" stroke="url(#g-blue)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 225 290 L 255 188 C 258 180 266 176 274 176 C 282 176 290 180 293 188 L 323 290 M 240 250 L 308 250" stroke="url(#g-coral)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 355 290 L 355 185 L 390 185 C 408 185 418 196 418 212 C 418 228 406 238 390 238 L 355 238 M 385 238 L 418 290" stroke="url(#g-purple)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 445 190 L 515 190 M 480 190 L 480 280" stroke="url(#g-lime)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- Subtitle Banner -->
    <div class="tagline-container">
      <div class="tagline-pill">
        <span class="tagline-spark">✦</span>
        <span class="tagline-text">FLUENT ENGLISH ECOSYSTEM</span>
      </div>
      <button class="enter-btn" id="enterBtn" onclick="enterApp()">START LEARNING ➔</button>
    </div>
  </section>

  <script>
    const tap = 'ontouchstart' in window || navigator.msMaxTouchPoints ? 'touchstart' : 'mousedown';

    // 1. Fireworks engine
    const fireworks = (function () {
      const getFontSize = function () {
        return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      };

      const canvas = document.querySelector('.fireworks');
      const ctx = canvas.getContext('2d');
      const numberOfParticules = 24;
      const distance = 180;
      let x = 0;
      let y = 0;
      const animations = [];

      const setCanvasSize = function () {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };

      const updateCoords = function (e) {
        x = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : window.innerWidth / 2);
        y = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : window.innerHeight / 2);
      };

      const colors = ['#2563EB', '#FF1744', '#F59E0B', '#10B981', '#7C3AED', '#D4FF00', '#FFFFFF'];

      const createCircle = function (x, y) {
        const p = {};
        p.x = x;
        p.y = y;
        p.color = '#FFFFFF';
        p.radius = 0.1;
        p.alpha = 1;
        p.lineWidth = 6;
        p.draw = function () {
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI, true);
          ctx.lineWidth = p.lineWidth;
          ctx.strokeStyle = p.color;
          ctx.stroke();
          ctx.globalAlpha = 1;
        };
        return p;
      };

      const createParticule = function (x, y) {
        const p = {};
        p.x = x;
        p.y = y;
        p.color = colors[anime.random(0, colors.length - 1)];
        p.radius = anime.random(getFontSize() * 0.8, getFontSize() * 1.8);
        p.draw = function () {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI, true);
          ctx.fillStyle = p.color;
          ctx.fill();
        };
        return p;
      };

      const createParticles = function (x, y) {
        const particules = [];
        for (let i = 0; i < numberOfParticules; i++) {
          particules.push(createParticule(x, y));
        }
        return particules;
      };

      const removeAnimation = function (animation) {
        const index = animations.indexOf(animation);
        if (index > -1) animations.splice(index, 1);
      };

      const animateParticules = function (x, y) {
        setCanvasSize();
        const particules = createParticles(x, y);
        const circle = createCircle(x, y);

        const particulesAnimation = anime({
          targets: particules,
          x: function (p) { return p.x + anime.random(-distance, distance); },
          y: function (p) { return p.y + anime.random(-distance, distance); },
          radius: 0,
          duration: function () { return anime.random(1100, 1600); },
          easing: 'easeOutExpo',
          complete: removeAnimation
        });

        const circleAnimation = anime({
          targets: circle,
          radius: function () { return anime.random(getFontSize() * 7, getFontSize() * 10); },
          lineWidth: 0,
          alpha: {
            value: 0,
            easing: 'linear',
            duration: function () { return anime.random(400, 600); }
          },
          duration: function () { return anime.random(1100, 1600); },
          easing: 'easeOutExpo',
          complete: removeAnimation
        });

        animations.push(particulesAnimation);
        animations.push(circleAnimation);
      };

      anime({
        duration: Infinity,
        update: function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          animations.forEach(function (anim) {
            anim.animatables.forEach(function (animatable) {
              animatable.target.draw();
            });
          });
        }
      });

      document.addEventListener(tap, function (e) {
        updateCoords(e);
        animateParticules(x, y);
      }, false);

      window.addEventListener('resize', setCanvasSize, false);
      setCanvasSize();

      return {
        boom: animateParticules
      };
    })();

    // 2. Exact Anime.js Timeline for "Let's Start"
    let hasPlayed = false;
    let wasiiNotified = false;

    function enterApp() {
      if (wasiiNotified) return;
      wasiiNotified = true;
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'WASII_FINISHED' }));
        }
      } catch (e) {}
    }

    function playLetsStartAnimation() {
      if (hasPlayed) return;
      hasPlayed = true;
      document.body.classList.add('ready');

      const setDashoffset = function (el) {
        const l = el.getTotalLength ? el.getTotalLength() : 350;
        el.setAttribute('stroke-dasharray', l);
        return [l, 0];
      };

      // 1. Line drawing for all 10 letters
      const letterTimeline = anime({
        targets: '#lines path',
        strokeDashoffset: {
          value: setDashoffset,
          duration: 900,
          easing: 'easeOutQuad'
        },
        transform: ['translate(0 48)', 'translate(0 0)'],
        delay: function (el, i) {
          return 350 + i * 110;
        },
        duration: 1600
      });

      // 2. Bouncing white orb dropping onto apostrophe
      const dotRoll = anime({
        targets: '#dot-wasii',
        transform: ['translate(0, -200)', 'translate(0, 0)'],
        delay: 850,
        duration: 800,
        easing: 'easeOutBounce',
        complete: function () {
          const dot = document.querySelector('#dot-wasii').getBoundingClientRect();
          fireworks.boom(dot.left + dot.width / 2, dot.top + dot.height / 2);
        }
      });

      // 3. Glowing fills reveal
      const fills = anime({
        targets: '#fills path',
        opacity: [0, 1],
        delay: function (el, i, l) {
          return 1200 + i * 90;
        },
        duration: 600,
        easing: 'linear',
        complete: function () {
          document.querySelector('#enterBtn').classList.add('visible');
          // Auto transition 4s after button appears
          setTimeout(enterApp, 4000);
        }
      });
    }

    window.playLetsStartAnimation = playLetsStartAnimation;

    // Tapping anywhere after button appears also enters app
    window.addEventListener('click', function(e) {
      if (document.querySelector('#enterBtn') && document.querySelector('#enterBtn').classList.contains('visible')) {
        enterApp();
      }
    });

    // Auto-play fallback after 5.5s if not triggered externally
    setTimeout(playLetsStartAnimation, 5500);
  </script>
</body>
</html>
